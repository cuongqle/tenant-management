services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tenantmng_postgres
    environment:
      POSTGRES_USER: tenantmng
      POSTGRES_PASSWORD: tenantmng_dev
      POSTGRES_DB: tenantmng
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantmng"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-test:
    build:
      context: ./backend
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://tenantmng:tenantmng_dev@postgres:5432/tenantmng
      JWT_SECRET_KEY: dev-secret-change-me-to-at-least-32-chars
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tenantmng:tenantmng_dev@postgres:5432/tenantmng
      JWT_SECRET_KEY: dev-secret-change-me-to-at-least-32-chars
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      api-test:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
